[project]
name = "orbio-agent"
version = "0.1.0"
description = "Conversational agent that interviews magic school students and recommends classes and clubs"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anthropic>=1.12",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.17",
    "httpx>=0.28",
]

[project.optional-dependencies]
# S3 conversation storage (STORAGE=s3), used by the AWS deployment.
aws = [
    "boto3>=1.35",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "moto[s3]>=5.0",
    "boto3-stubs[s3]>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
